# VoIP / RTP tuning -- added 2026-08-05 during audio remediation.
# --- UDP receive buffers ---------------------------------------------
# Asterisk's RTP sockets never call setsockopt(SO_RCVBUF); they inherit
# net.core.rmem_default verbatim. This is the knob that sizes RTP buffers.
# Raising net.core.rmem_max alone -- the advice in every VoIP tuning blog --
# would change NOTHING for RTP.
net.core.rmem_default = 1048576

# --- VM behaviour ----------------------------------------------------
# Keep Asterisk's anonymous pages resident; a swapped RTP buffer is an
# audible glitch. 10 still permits swapping under genuine pressure.
vm.swappiness = 10
